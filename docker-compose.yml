services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/backend
    environment:
      DATABASE_PATH: /app/data/crm.db
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
